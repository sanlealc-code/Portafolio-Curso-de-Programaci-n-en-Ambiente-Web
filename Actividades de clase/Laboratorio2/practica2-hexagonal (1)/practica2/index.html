<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Prompt Engineer Workspace</title>
<!--
  ============================================================
  PRÁCTICA 2 — MEMORIA DE CONTEXTO DEL LLM (versión modular)
  ============================================================
  Estructura:
    css/styles.css     -> presentación
    js/api-llm.js       -> CONGELADO, contrato de la API (no tocar)
    js/storage.js        -> capa de almacenamiento (sessionStorage,
                            localStorage y Cookie, cada uno aislado)
    js/network.js         -> capa de red (valida cookie antes de
                            llamar a ApiLLM, traduce errores)
    js/ui.js               -> capa de UI (único módulo que toca el DOM)
    js/app.js                -> orquestador (conecta las tres capas)

  IMPORTANTE: al usar <script type="module">, el navegador
  bloquea la carga por CORS si abren el archivo con doble clic
  (file://). Sirvan la carpeta con un servidor local, por
  ejemplo:  python -m http.server   o  la extensión Live Server.
  Esto también es necesario para que las cookies funcionen.
  ============================================================
-->
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="top">
  <h1>🧪 Prompt Engineer Workspace</h1>
  <div style="display:flex; gap:10px; align-items:center;">
    <span id="badgeToken">🍪 Sin sesión</span>
    <button id="btnLogin">Iniciar sesión (emitir token)</button>
  </div>
</div>

<div class="cols">
  <div class="panel">
    <h2>⭐ Prompts Favoritos</h2>
    <div class="sub">Deben sobrevivir a reinicios del navegador</div>
    <div id="listaFavoritos"></div>
    <button id="btnGuardarFav">+ Guardar prompt actual</button>
  </div>

  <div class="panel">
    <h2>💬 Conversación actual</h2>
    <div class="sub">Pestaña duplicada = hilo nuevo en blanco</div>
    <div id="conversacion"></div>
    <div class="fila">
      <input id="prompt" type="text" placeholder="Escribe tu prompt..." autocomplete="off">
      <button id="btnEnviar">Enviar</button>
    </div>
  </div>
</div>

<div id="modal">
  <div class="caja">
    <h3>⚠ Sesión expirada (401)</h3>
    <p>Tu token venció. La conversación actual se borró,
       pero tus favoritos siguen intactos.</p>
    <button id="btnCerrarModal">Entendido</button>
  </div>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
